# Igual a um site típico do Shrew: Main Mode, PSK + XAuth, DH 14, AES-256, SHA2-256, Mode Config.
connections {
  rw {
    version = 1
    aggressive = no
    proposals = aes256-sha256-modp2048, aes128-sha1-modp1024, 3des-sha1-modp1024
    pools = vpnpool
    dpd_delay = 30s
    local {
      auth = psk
    }
    remote-psk {
      auth = psk
    }
    remote-xauth {
      auth = xauth-generic
    }
    children {
      rw {
        local_ts = 10.99.0.0/24, 10.97.0.0/16
        esp_proposals = aes256-sha256-modp2048, aes256-sha256, aes128-sha1
        dpd_action = clear
      }
    }
  }
}
pools {
  vpnpool {
    addrs = 10.98.0.10-10.98.0.50
    dns = 10.99.0.53
  }
}
secrets {
  ike-psk {
    secret = "chave de teste"
  }
  xauth-ana {
    id = ana
    secret = "senha da ana"
  }
}

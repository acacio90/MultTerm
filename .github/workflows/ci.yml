name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# Nada por padrão: cada job pede só o que usa.
permissions: {}

# Um push novo no mesmo PR cancela a rodada anterior (em develop/main, todas terminam).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read # só o checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes de unidade
        run: npm test

      - name: Cliente RDP (FreeRDP)
        run: npm run fetch:freerdp

      - name: Testes de interface (Electron + Playwright)
        run: npm run test:ui

      - name: Artefatos dos testes de interface
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # Servidor NFS do MultTerm contra o cliente NFS do kernel Linux (portmapper, MOUNT e NFSv3).
  nfs-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # só o checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Cliente NFS do Linux
        run: sudo apt-get update -q && sudo apt-get install -y -q nfs-common

      - name: Servidor NFS do MultTerm
        run: |
          # O rpcbind do sistema usa a porta 111: sai para o portmapper do MultTerm.
          sudo systemctl stop rpcbind.socket rpcbind || true
          mkdir -p /tmp/nfsroot/boot /tmp/nfsroot/sub
          head -c 1048576 /dev/urandom > /tmp/nfsroot/boot/kernel.bin
          echo "olá NFS" > /tmp/nfsroot/readme.txt
          for i in $(seq 1 60); do echo "$i" > /tmp/nfsroot/sub/arquivo-$i.txt; done
          sudo node test/nfs-linux/serve.ts /tmp/nfsroot > /tmp/nfs.log 2>&1 &
          for i in $(seq 1 20); do grep -q pronto /tmp/nfs.log && break; sleep 0.5; done
          cat /tmp/nfs.log
          rpcinfo -p 127.0.0.1
          showmount -e 127.0.0.1

      - name: Montar e ler; gravar é recusado
        run: |
          # O kernel do Ubuntu vem sem NFS sobre UDP (CONFIG_NFS_DISABLE_UDP_SUPPORT): monta por TCP;
          # o UDP é conferido com o rpcinfo (cliente RPC real) logo abaixo.
          for proto in tcp; do
            echo "== $proto"
            sudo mkdir -p /mnt/$proto
            sudo mount -t nfs -o vers=3,proto=$proto,mountproto=$proto,nolock 127.0.0.1:/ /mnt/$proto
            ls -la /mnt/$proto /mnt/$proto/boot
            test "$(ls /mnt/$proto/sub | wc -l)" = 60
            cmp /tmp/nfsroot/boot/kernel.bin /mnt/$proto/boot/kernel.bin
            grep -q "olá NFS" /mnt/$proto/readme.txt
            if sudo touch /mnt/$proto/novo 2>/tmp/touch.err; then echo "a escrita deveria falhar"; exit 1; fi
            cat /tmp/touch.err
            grep -qi "read-only" /tmp/touch.err
            sudo umount /mnt/$proto
          done
          rpcinfo -u 127.0.0.1 100003 3
          rpcinfo -u 127.0.0.1 100005 3
          rpcinfo -t 127.0.0.1 100003 3

      - name: Log do servidor
        if: always()
        run: cat /tmp/nfs.log

  # Servidor VNC do MultTerm contra um cliente VNC real (vncdotool), com uma tela sintética.
  vnc-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # só o checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cliente VNC (vncdotool)
        run: pip install vncdotool pillow

      - name: Servidor VNC do MultTerm
        run: |
          node test/vnc-linux/serve.ts segredo1 > /tmp/vnc.log 2>&1 &
          for i in $(seq 1 20); do grep -q pronto /tmp/vnc.log && break; sleep 0.5; done
          cat /tmp/vnc.log

      - name: Capturar a tela e conferir os pixels; senha errada é recusada
        run: |
          vncdo -s 127.0.0.1::5900 -p segredo1 capture /tmp/tela.png
          python - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/tela.png').convert('RGB')
          assert im.size == (320, 200), im.size
          for x, y in [(0, 0), (10, 20), (100, 50), (319, 199), (200, 150)]:
              esperado = ((x + y) & 255, y & 255, x & 255)
              assert im.getpixel((x, y)) == esperado, (x, y, im.getpixel((x, y)), esperado)
          print('pixels conferem')
          PY
          if timeout 20 vncdo -s 127.0.0.1::5900 -p errada capture /tmp/x.png; then echo "a senha errada deveria falhar"; exit 1; fi
          grep -q "senha errada" /tmp/vnc.log

      - name: Log do servidor
        if: always()
        run: cat /tmp/vnc.log
